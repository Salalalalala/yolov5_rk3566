[binaries]
c = '/bin/aarch64-linux-gnu-gcc'
cpp = '/bin/aarch64-linux-gnu-g++'
ar = '/bin/aarch64-linux-gnu-ar'
ld = '/bin/aarch64-linux-gnu-ld'
strip = '/bin/aarch64-linux-gnu-strip'

[properties]
# 正确键名是 sys_root（带下划线），供 pkg-config 查找 .pc 文件用。
# 注意：Meson 0.53 不会据此给编译器自动加 --sysroot，板端库的链接
# 搜索路径需在 meson.build 里显式加 -L（见 jpeg_dep 的写法）。
sys_root = '/home/jaja/rk3566yolo/sysroot'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
